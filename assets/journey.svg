<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 250" width="1200" height="250" role="img" aria-label="Journey: network kid, DevSecOps, fibre and 5G, ML R&amp;D, founding AI/ML engineer, platform and thesis">
<defs>
  <linearGradient id="grad" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#7f5af0"/><stop offset="0.5" stop-color="#22d3ee"/><stop offset="1" stop-color="#f472b6"/>
  </linearGradient>
  <pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse">
    <circle cx="2" cy="2" r="1.2" fill="#ffffff" fill-opacity="0.07"/>
  </pattern>
  <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
    <feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <filter id="blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="60"/></filter>
</defs>
<rect width="1200" height="250" rx="24" fill="#0b0d17"/><rect width="1200" height="250" rx="24" fill="url(#dots)"/>
<line x1="110" y1="128" x2="1150" y2="128" stroke="#ffffff" stroke-opacity="0.1" stroke-width="3" stroke-dasharray="4 8"/>
<line x1="110" y1="128" x2="1090" y2="128" stroke="url(#grad)" stroke-width="4" stroke-linecap="round"
  stroke-dasharray="980">
  <animate attributeName="stroke-dashoffset" values="980;0" dur="3s" fill="freeze"/>
</line>
