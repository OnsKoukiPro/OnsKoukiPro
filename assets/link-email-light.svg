<style>@font-face{font-family:GroteskBold;font-weight:600;font-style:normal;src:url(data:font/woff2;base64,) format('woff2')}.gb{font-family:GroteskBold,-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif;font-weight:600;font-style:normal}
.f { opacity: 0; animation: fade 1.4s ease-out forwards; }
.u { opacity: 0; animation: up 1.3s cubic-bezier(.2,.7,.2,1) forwards; }
