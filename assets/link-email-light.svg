<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 109 34" width="109" height="34" fill="none" role="img" aria-label="Email">
<defs>
  <linearGradient id="grad" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#6d28d9"/><stop offset="0.5" stop-color="#0891b2"/><stop offset="1" stop-color="#db2777"/>
  </linearGradient>
  <linearGradient id="shine" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="300" y2="0">
    <stop offset="0" stop-color="#6d28d9"/><stop offset="0.45" stop-color="#6d28d9"/>
    <stop offset="0.5" stop-color="#0891b2"/>
