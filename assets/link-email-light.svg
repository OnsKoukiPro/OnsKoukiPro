<text class="gb f" style="animation-delay:1.30s" x="0" y="26" font-size="24" fill="url(#shine)">Email<tspan dx="8" font-size="18" fill="#6d28d9">↗<animate attributeName="dx" values="8;12;8;8" keyTimes="0;0.05;0.1;1" dur="5s" begin="3.7s" repeatCount="indefinite"/><animate attributeName="dy" values="-2;-6;-2;-2" keyTimes="0;0.05;0.1;1" dur="5s" begin="3.7s" repeatCount="indefinite"/></tspan></text>
