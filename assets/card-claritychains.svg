<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 250" width="1200" height="250" role="img" aria-label="ClarityChains: LLM agents that read supplier offers, flag the traps and pick a winner. Concept, UX, models, backend, deployment: every box, end to end.">
<defs>
  <linearGradient id="grad" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#7f5af0"/><stop offset="0.5" stop-color="#22d3ee"/><stop offset="1" stop-color="#f472b6"/>
  </linearGradient>
  <pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse">
    <circle cx="2" cy="2" r="1.2" fill="#ffffff" fill-opacity="0.07"/>
  </pattern>
  <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
    <feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <filter id="blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="60"/></filter>
</defs>
<clipPath id="c"><rect width="1200" height="250" rx="22"/></clipPath>
<rect width="1200" height="250" rx="22" fill="#121528"/>
<rect width="1200" height="250" rx="22" fill="url(#dots)"/>
<g clip-path="url(#c)"><rect x="-300" y="0" width="160" height="250" fill="#ffffff" opacity="0.05" transform="skewX(-20)">
  <animate attributeName="x" values="-300;1500;1500" keyTimes="0;0.4;1" dur="7s" repeatCount="indefinite"/></rect></g>
<rect x="1.5" y="1.5" width="1197" height="247" rx="21" fill="none" stroke="url(#grad)" stroke-width="3"/>
<text x="40" y="78" font-size="42">🤖</text>
<text x="104" y="74" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="30" font-weight="800" fill="#f8fafc">ClarityChains</text>
<g transform="translate(356,50)">
  <rect width="74" height="28" rx="14" fill="#a3e635" fill-opacity="0.15" stroke="#a3e635"/>
  <circle cx="16" cy="14" r="5" fill="#a3e635"><animate attributeName="opacity" values="1;0.2;1" dur="1.4s" repeatCount="indefinite"/></circle>
  <text x="44" y="19" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="700" fill="#a3e635">LIVE</text>
</g>
<text x="42" y="126" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="21" fill="#e2e8f0">LLM agents that read supplier offers, flag the traps and pick a winner.</text>
<text x="42" y="158" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="21" fill="#94a3b8">Concept, UX, models, backend, deployment: every box, end to end.</text>
<rect x="42" y="186" width="72" height="32" rx="16" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.12"/><text x="78" y="207" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" fill="#cbd5e1">React</text><rect x="124" y="186" width="82" height="32" rx="16" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.12"/><text x="165" y="207" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" fill="#cbd5e1">Django</text><rect x="216" y="186" width="91" height="32" rx="16" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.12"/><text x="262" y="207" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" fill="#cbd5e1">FastAPI</text><rect x="317" y="186" width="110" height="32" rx="16" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.12"/><text x="372" y="207" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" fill="#cbd5e1">LangChain</text><rect x="437" y="186" width="138" height="32" rx="16" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.12"/><text x="506" y="207" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" fill="#cbd5e1">Azure OpenAI</text><rect x="585" y="186" width="82" height="32" rx="16" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.12"/><text x="626" y="207" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" fill="#cbd5e1">Docker</text>
</svg>
