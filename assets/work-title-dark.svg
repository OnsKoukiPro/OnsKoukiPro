<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 118" width="1200" height="118" fill="none" role="img" aria-label="Things I've made. Built end to end.">
<defs>
  <linearGradient id="grad" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#60a5fa"/><stop offset="0.5" stop-color="#a78bfa"/><stop offset="1" stop-color="#f472b6"/>
  </linearGradient>
  <radialGradient id="glowA"><stop offset="0" stop-color="#60a5fa" stop-opacity="0.3"/><stop offset="1" stop-color="#60a5fa" stop-opacity="0"/></radialGradient>
  <radialGradient id="glowB"><stop offset="0" stop-color="#f472b6" stop-opacity="0.24"/><stop offset="1" stop-color="#f472b6" stop-opacity="0"/></radialGradient>
</defs>
<style>@font-face{font-family:InterDisplay;font-weight:700;src:url(data:font/woff2;base64,) format('woff2')}.b{font-family:InterDisplay,-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Helvetica, Arial, sans-serif;font-weight:700}
.f { opacity: 0; animation: fade 1.2s ease-out forwards; }
.u { opacity: 0; animation: up 1.2s cubic-bezier(.16,1,.3,1) forwards; }
@keyframes fade { to { opacity: 1; } }
@keyframes up { from { opacity: 0; transform: translateY(30px); } to { opacity: 1; transform: none; } }
</style>
<text class="b u" style="animation-delay:0.15s" x="0" y="96" font-size="56" letter-spacing="-1.8"><tspan fill="#f5f5f7">Things I've made.</tspan> <tspan fill="#86868b">Built end to end.</tspan></text>
</svg>
