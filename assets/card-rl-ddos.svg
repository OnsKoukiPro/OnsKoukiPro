<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 250" width="600" height="250" role="img" aria-label="RL × SDN DDoS: A network that learns when to block a flood. 94.6% detection baseline.">
<defs>
  <linearGradient id="grad" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#7f5af0"/><stop offset="0.5" stop-color="#22d3ee"/><stop offset="1" stop-color="#f472b6"/>
  </linearGradient>
  <pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse">
    <circle cx="2" cy="2" r="1.2" fill="#ffffff" fill-opacity="0.07"/>
  </pattern>
  <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
    <feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <filter id="blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="60"/></filter>
</defs>
<clipPath id="c"><rect width="600" height="250" rx="22"/></clipPath>
<rect width="600" height="250" rx="22" fill="#121528"/>
<rect width="600" height="250" rx="22" fill="url(#dots)"/>
<g clip-path="url(#c)"><rect x="-300" y="0" width="160" height="250" fill="#ffffff" opacity="0.05" transform="skewX(-20)">
  <animate attributeName="x" values="-300;900;900" keyTimes="0;0.4;1" dur="7s" repeatCount="indefinite"/></rect></g>
<rect x="1.5" y="1.5" width="597" height="247" rx="21" fill="none" stroke="url(#grad)" stroke-width="3"/>
<text x="40" y="78" font-size="42">🛡️</text>
<text x="104" y="74" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="30" font-weight="800" fill="#f8fafc">RL × SDN DDoS</text>
<text x="42" y="126" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="21" fill="#e2e8f0">A network that learns when to block a flood.</text>
<text x="42" y="158" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="21" fill="#94a3b8">94.6% detection baseline.</text>
<rect x="42" y="186" width="54" height="32" rx="16" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.12"/><text x="69" y="207" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" fill="#cbd5e1">Ryu</text><rect x="106" y="186" width="91" height="32" rx="16" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.12"/><text x="151" y="207" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" fill="#cbd5e1">Mininet</text><rect x="207" y="186" width="119" height="32" rx="16" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.12"/><text x="266" y="207" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" fill="#cbd5e1">TensorFlow</text>
</svg>
