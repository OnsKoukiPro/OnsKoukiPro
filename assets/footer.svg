<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 170" width="1200" height="170" role="img" aria-label="To be continued. Got a wild idea? Let's build it.">
<defs>
  <linearGradient id="grad" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#7f5af0"/><stop offset="0.5" stop-color="#22d3ee"/><stop offset="1" stop-color="#f472b6"/>
  </linearGradient>
  <pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse">
    <circle cx="2" cy="2" r="1.2" fill="#ffffff" fill-opacity="0.07"/>
  </pattern>
  <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
    <feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <filter id="blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="60"/></filter>
</defs>
<rect width="1200" height="170" rx="24" fill="#0b0d17"/><rect width="1200" height="170" rx="24" fill="url(#dots)"/>
<clipPath id="type"><rect x="393" y="20" width="0" height="90">
  <animate attributeName="width" values="0;424;424;0" keyTimes="0;0.35;0.85;1" dur="7s" repeatCount="indefinite"/></rect></clipPath>
<text x="393" y="88" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="46" font-weight="700" fill="url(#grad)" clip-path="url(#type)">to be continued</text>
<rect x="393" y="50" width="22" height="46" fill="#22d3ee">
  <animate attributeName="x" values="393;815;815;393" keyTimes="0;0.35;0.85;1" dur="7s" repeatCount="indefinite"/>
  <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/>
</rect>
<text x="600.0" y="136" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="19" fill="#94a3b8">got a wild idea that needs someone to own it end to end? let's build it ✨</text>
</svg>
