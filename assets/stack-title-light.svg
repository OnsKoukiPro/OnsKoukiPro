<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 52" width="1200" height="52" fill="none" role="img" aria-label="toolbox">
<defs>
  <linearGradient id="shine" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="300" y2="0">
    <stop offset="0" stop-color="#6d28d9"/><stop offset="0.45" stop-color="#6d28d9"/>
    <stop offset="0.5" stop-color="#1f2328" stop-opacity="0.9"/>
    <stop offset="0.55" stop-color="#6d28d9"/><stop offset="1" stop-color="#6d28d9"/>
    <animateTransform attributeName="gradientTransform" type="translate" values="-400 0;1200 0;1200 0" keyTimes="0;0.25;1" dur="12s" repeatCount="indefinite"/>
  </linearGradient>
</defs>
<style>
.f { opacity: 0; animation: fade 1.4s ease-out forwards; }
@keyframes fade { to { opacity: 1; } }
</style>
<text class="f" style="animation-delay:0.30s" x="0" y="30" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" fill="#656d76">toolbox</text>
<line class="f" style="animation-delay:0.30s" x1="0" y1="46" x2="1200" y2="46" stroke="#d0d7de"/>
</svg>
