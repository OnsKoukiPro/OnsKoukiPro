<text class="mb" x="26.0" y="33.0" font-size="16" letter-spacing="2" text-anchor="start" fill="#0f1115" xml:space="preserve">LIVE DEMO</text>
<g transform="translate(148 19)"><path d="M2 14 L14 2 M5 2 H14 V11" stroke="#ff4f1f" stroke-width="2.2" stroke-linecap="square">
<animateTransform attributeName="transform" type="translate" values="0 0;3 -3;0 0;0 0" keyTimes="0;0.05;0.1;1" dur="5s" begin="5.2s" repeatCount="indefinite"/></path></g>
