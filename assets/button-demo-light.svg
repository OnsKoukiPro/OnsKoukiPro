<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 190 54" width="190" height="54" fill="none" role="img" aria-label="Live demo">
<style>@font-face{font-family:JBMonoBold;font-weight:700;src:url(data:font/woff2;base64,) format('woff2')}.mb{font-family:JBMonoBold,ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;font-weight:700}
.f { opacity: 0; animation: fade 1s ease-out forwards; }
.dw { stroke-dasharray: 1 1; stroke-dashoffset: 1; animation: draw 1.1s cubic-bezier(.65,0,.35,1) forwards; }
.blink { animation: blink 1.1s steps(1) infinite; }
@keyframes fade { to { opacity: 1; } }
@keyframes draw { to { stroke-dashoffset: 0; } }
@keyframes blink { 50% { opacity: 0; } }
</style>
<g class="f" style="animation-delay:0.84s">
<rect x="5" y="5" width="180" height="44" fill="none" stroke="#0f1115" stroke-width="1.4"/>
